<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page not found &middot; One Life</title>
<!-- A 404 must never be indexed. Netlify serves this with a real 404 status,
     but noindex is belt and braces in case it is ever fetched another way. -->
<meta name="robots" content="noindex,follow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0b0b12; color: #eef0f6;
    font: 400 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px; text-align: center;
  }
  .wrap { max-width: 30rem; }
  .mark {
    width: 68px; height: 68px; margin: 0 auto 26px; border-radius: 50%;
    background: radial-gradient(120% 120% at 50% -25%, #ffffff2b 0%, #ffffff00 62%),
                linear-gradient(165deg, #7c89b0 0%, #3f4a75 100%);
    box-shadow: 0 18px 44px -14px rgba(75, 88, 140, .75);
  }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 10px; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: #a8aec8; }
  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 11px 20px; border-radius: 999px;
    text-decoration: none; font-weight: 600; font-size: .95rem;
    border: 1px solid #ffffff26; color: #eef0f6;
  }
  a.btn.primary { background: #eef0f6; color: #14141c; border-color: #eef0f6; }
  a.btn:hover { border-color: #ffffff55; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true"></div>
    <h1>That page is not here.</h1>
    <p>The link may be old, or slightly mistyped. Everything is still one tap away.</p>
    <div class="links">
      <a class="btn primary" href="/luten">Luten</a>
      <a class="btn" href="/">One Life</a>
      <a class="btn" href="/contact">Contact</a>
    </div>
  </main>
</body>
</html>

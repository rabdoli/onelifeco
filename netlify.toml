# One Life - static site config
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Password AutoFill: iOS fetches this file to learn that app.cassette.deck and
# onelifeco.app share accounts, so it can offer to save and fill the password.
# Apple requires application/json, and the file has no extension, so Netlify
# would otherwise serve it as application/octet-stream and iOS would ignore it.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# long-cache the immutable image/icon assets
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep build sources and internal docs out of the public site.
#
# publish = "." uploads the whole repo root, so _source.html, CLAUDE.md and the
# build scripts physically exist on the CDN and would serve at 200. A plain
# redirect will not fire for a path that maps to a real uploaded file, so these
# use force = true to win over the file and return the 404 page instead. The
# IndexNow key file (<key>.txt) is deliberately NOT blocked: it must stay public
# so Bing/IndexNow can fetch it to verify domain ownership.
[[redirects]]
  from = "/_source.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/seo-build.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/luten_ld.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Missing paths must 404, not serve the homepage at 200.
#
# The old rule sent every unmatched path to /index.html with status 200, so
# https://onelifeco.app/anything-at-all returned the full homepage successfully.
# That is a soft 404: an unbounded number of unique URLs all serving identical
# content, which Google either treats as duplicates or flags outright.
#
# Safe to remove the fallback because the site is no longer an SPA. seo-build.py
# writes a real index.html per route (/, /luten, /about, /contact,
# /termsofservice, /privacypolicy) and Netlify serves those files directly;
# nothing depends on client-side routing to resolve a URL.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

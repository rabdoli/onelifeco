# One Life - static site config
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# long-cache the immutable image/icon assets
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Missing paths must 404, not serve the homepage at 200.
#
# The old rule sent every unmatched path to /index.html with status 200, so
# https://onelifeco.app/anything-at-all returned the full homepage successfully.
# That is a soft 404: an unbounded number of unique URLs all serving identical
# content, which Google either treats as duplicates or flags outright.
#
# Safe to remove the fallback because the site is no longer an SPA. seo-build.py
# writes a real index.html per route (/, /luten, /about, /contact,
# /termsofservice, /privacypolicy) and Netlify serves those files directly;
# nothing depends on client-side routing to resolve a URL.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

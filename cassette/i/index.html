  <style>
    /* A friend's invite link: www.onelifeco.app/cassette/i/<CODE> (Netlify serves this one page for every code).
       With Cassette installed, iOS and Android open the app straight away (apple-app-site-association and
       assetlinks.json) and this page never shows. Without it, it sends the friend to the App Store or Google Play
       and says to tap the link again after installing, so the app can add the 3 tapes. Same deck and paper as
       /cassette/open. */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #2B080D; font-family: Manrope, Helvetica, Arial, sans-serif; color: #2B2A28;
           display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .deck { background: #E9E6E0; border: 3px solid #C9C5BE; border-radius: 28px; width: 100%; max-width: 420px; padding: 20px 20px 16px; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 14px; border-bottom: 1px solid rgba(0,0,0,.18); }
    .top span { font-size: 18px; color: #3A3835; } .top b { font-weight: 800; }
    .top img { width: 40px; height: 40px; border-radius: 10px; display: block; }
    .paper { background: #F8F3E8; border: 1px solid #DDD6CA; border-radius: 10px; margin-top: 16px; position: relative; padding: 18px 18px 22px 58px; }
    .paper::before { content: ''; position: absolute; left: 40px; top: 0; bottom: 0; width: 2px; background: #D17370; }
    h1 { font-family: Caveat, cursive; font-weight: 600; font-size: 32px; line-height: 36px; margin: 0 0 8px; overflow-wrap: anywhere; }
    p { font-size: 15px; line-height: 23px; margin: 0 0 6px; }
    .keys { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
    .key { display: block; text-align: center; background: #F6F4F0; border: 1px solid #D5D1CA; border-radius: 10px; box-shadow: 0 4px 0 #B9B6AF;
           padding: 14px 12px; font: 700 12px 'Space Mono', Menlo, monospace; letter-spacing: 2.5px; color: #2B2A28; text-decoration: none; }
    .key.first { color: #B04A4A; }
    .key:active { box-shadow: 0 1px 0 #B9B6AF; transform: translateY(3px); }
    .small { font-size: 13px; line-height: 20px; color: #6E6A63; margin-top: 18px; }
    .small a { color: #1B7C63; font-weight: 700; text-decoration: none; }
  </style>
  <script>

    // Same setup as /cassette (nothing stored on the device; see the notes there).
    posthog.init('phc_p6G3z2vRAvtDDUM6S7rwfZnLmuVwGwnkWnUuPQRcf8ny', {
      api_host: 'https://us.i.posthog.com', persistence: 'memory', person_profiles: 'identified_only',

<body>
  <div class="deck">
    <div class="top"><span>cassette <b>deck</b></span><img src="https://www.onelifeco.app/email/cassette-icon-email.png" alt="Cassette"></div>
    <div class="paper">
      <h1 id="heading">A friend sent you 3 extra free tapes</h1>
      <p>Cassette records your lectures and meetings and writes the notes on the phone, nothing uploaded.</p>
      <div class="keys">
        <a class="key first" id="appstore" href="https://apps.apple.com/app/apple-store/id6812001404?pt=129004817&amp;ct=invite&amp;mt=8">APP STORE</a>
        <a class="key" id="play" href="https://play.google.com/store/apps/details?id=app.cassette.deck&amp;utm_source=onelifeco&amp;utm_campaign=invite">GOOGLE PLAY</a>
      </div>
      <p class="small">After installing, tap your invite link again to add your tapes.</p>
      <p class="small">Already have Cassette? <a id="open" href="cassettedeck://open">Add my tapes</a></p>
    </div>
  </div>
  <script>
    // The code is the last part of the path: /cassette/i/REZA7K. Letters and digits only, as the app reads it.
    var parts = location.pathname.split('/').filter(Boolean);
    var raw = parts[0] === 'cassette' && parts[1] === 'i' && parts[2] !== 'index.html' ? (parts[2] || '') : '';
    var code = decodeURIComponent(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4 || code.length > 16) code = '';
    // The heading names the friend once the server knows the code ("Reza sent you..."); until then, and for a code
    // it doesn't know, it stays "A friend". The code itself is never shown as a name.
    if (code) {
      fetch('https://us-central1-cassette-deck-app.cloudfunctions.net/redeemInvite', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { code: code, preview: true } })
      }).then(function (r) { return r.json(); }).then(function (j) {
        var name = j && j.result && j.result.status === 'found' && (j.result.inviterName || '').trim();
        if (!name) return;
        document.getElementById('heading').textContent = name + ' sent you 3 extra free tapes';
        document.title = name + ' sent you 3 extra free tapes';
      }).catch(function () {});
    }
    // Opened in a browser with the app already there (a link typed or pasted into the address bar never opens an
    // app): hand the code to Cassette directly. On Android, an intent that falls back to Google Play.
    var open = document.getElementById('open');
    var deep = 'cassettedeck://i/' + code;
    if (!code) open.parentNode.style.display = 'none';
    else if (/Android/i.test(navigator.userAgent)) {
      var play = document.getElementById('play').href;
      open.href = 'intent://i/' + code + '#Intent;scheme=cassettedeck;package=app.cassette.deck;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
      // The store for this phone first.
      var keys = document.querySelector('.keys');
      keys.insertBefore(document.getElementById('play'), keys.firstChild);
      document.getElementById('play').classList.add('first');
      document.getElementById('appstore').classList.remove('first');
    } else {
      open.href = deep;
    }
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a');
      if (!a || !window.posthog) return;
      var kind = a.id === 'appstore' ? 'appstore_click' : a.id === 'play' ? 'playstore_click' : a.id === 'open' ? 'invite_open_app_click' : null;
      if (kind) posthog.capture(kind, { route: '/cassette/i/', has_code: !!code, link_text: (a.textContent || '').trim().slice(0, 60) });
    }, true);
  </script>
</body>
